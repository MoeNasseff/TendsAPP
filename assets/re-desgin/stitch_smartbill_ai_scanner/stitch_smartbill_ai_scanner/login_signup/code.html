<style>

            background: transparent;
            border: none;

        }
        .input-ghost:focus {
            outline: none;
            border-bottom-color: theme('colors.primary-container');
            box-shadow: none;
        }
        
        .glow-effect {
            position: relative;
        }
        .glow-effect::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 150%;
            height: 150%;
